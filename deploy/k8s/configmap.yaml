apiVersion: v1
kind: ConfigMap
metadata:
  name: dde-config
  labels:
    app.kubernetes.io/name: dde
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: document-data-extractor
data:
  # Replace both placeholders for the selected Responses-compatible provider.
  OPENAI_BASE_URL: "https://REPLACE_ME.example/openai/v1/"
  DDE_MODEL: "REPLACE_ME"
  DDE_AUTH_MODE: "api_key"
  DDE_MAX_FILE_BYTES: "15728640"
  DDE_MAX_PAGES: "10"
  DDE_MAX_IMAGE_PIXELS: "25000000"
  DDE_MAX_TABULAR_ROWS: "10000"
  DDE_MAX_TABULAR_COLUMNS: "100"
  DDE_MAX_CELL_CHARS: "4096"
  DDE_MAX_TABULAR_CHARS: "200000"
  DDE_MAX_SHEETS: "20"
  DDE_MAX_XLSX_ZIP_ENTRIES: "1000"
  DDE_MAX_XLSX_UNCOMPRESSED_BYTES: "52428800"
  DDE_RENDER_DPI: "144"
  DDE_REQUEST_TIMEOUT_SECONDS: "120"
  DDE_MAX_REQUEST_BYTES: "16777216"
  DDE_MAX_CONCURRENT_REQUESTS: "2"
  DDE_API_TIMEOUT_SECONDS: "130"
  DDE_LOG_LEVEL: "INFO"
  PORT: "8080"
