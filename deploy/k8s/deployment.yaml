apiVersion: apps/v1
kind: Deployment
metadata:
  name: dde
  labels:
    app.kubernetes.io/name: dde
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: document-data-extractor
  annotations:
    dde.dev/image-note: "Published task19 image; immutable Docker Hub index digest"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dde
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dde
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: document-data-extractor
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dde
          # Published linux/amd64 task19 image with provenance attestation.
          image: docker.io/khushwant04/dde@sha256:0aff95c2f273cadbdf7b31f7a5fd2e57eab318524a306ba1708b44338eeb70d7
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - dde.api:app
            - --host
            - 0.0.0.0
            - --port
            - $(PORT)
            - --no-server-header
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dde-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dde-provider
                  key: OPENAI_API_KEY
                  optional: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-workspace
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: temporary-workspace
          emptyDir:
            sizeLimit: 256Mi
